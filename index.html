<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Converter from Widget to Iframe Widget</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      header {
        background-color: #333;
        color: white;
        width: 100%;
        padding: 20px;
        text-align: center;
      }

      main {
        margin: 20px;
        display: flex;
        flex-direction: column;
        width: 80%;
        max-width: 1200px;
      }

      textarea {
        width: 100%;
        height: 200px;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
        resize: none;
      }

      .result {
        position: relative;
      }

      .result textarea {
        margin-bottom: 0;
      }

      .result .copy {
        position: absolute;
        bottom: 20px;
        right: 20px;
        padding: 6px 12px;
        border-radius: 4px;
        border: 1px solid rgb(204, 204, 204);
        background-color: rgb(239, 239, 239);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Converter from Widget to Iframe Widget</h1>
    </header>

    <main>
      <textarea
        id="widgetCode"
        placeholder="Enter widget HTML code here..."
      ></textarea>
      <div class="result">
        <textarea
          id="iframeCode"
          placeholder="Converted iframe code will appear here..."
          readonly
        ></textarea>
        <button class="copy">Copy</button>
      </div>
    </main>

    <script>
      function toast({ message, delay, duration }) {
        function showToast() {
          const toastBlock = Object.assign(document.createElement('div'), {
            style: `position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-200%); background-color: #fff; color: #333; padding: 10px 20px; border-radius: 5px; border: 1px solid #333; z-index: 9999; transition: transform ${duration}ms ease-in-out;`,
            textContent: message
          });

          document.body.prepend(toastBlock);
          setTimeout(() => {
            toastBlock.style.transform = 'translateX(-50%) translateY(0)';

            setTimeout(() => {
              toastBlock.style.transform = 'translateX(-50%) translateY(-200%)';
              setTimeout(() => {
                toastBlock.remove();
              }, duration);
            }, delay);
          }, duration);
        }

        return showToast;
      }

      const copyButton = document.querySelector('.copy');
      const widgetCodeTextArea = document.getElementById('widgetCode');
      const iframeCodeTextArea = document.getElementById('iframeCode');
      if (!widgetCodeTextArea.value) {
        copyButton.style.display = 'none';
      }
      const showToast = toast({
        message: 'Copied',
        delay: 3000,
        duration: 300
      });

      widgetCodeTextArea.addEventListener('input', convertWidgetToIframe);
      copyButton.addEventListener('click', () => {
        iframeCodeTextArea.select();
        iframeCodeTextArea.setSelectionRange(0, 99999);

        navigator.clipboard.writeText(iframeCodeTextArea.value);
        showToast();
      });

      function convertWidgetToIframe() {
        const widgetCode = document.getElementById('widgetCode').value;
        const iframeResizerScript = `<script src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.2.10/iframeResizer.min.js"><\/script>\n`;
        const widgetDivs = widgetCode.match(
          /<div class="elfsight-app-[\w-]+"[^>]*><\/div>/g
        );

        if (widgetDivs) {
          const iframeBlocks = widgetDivs
            .map((div, _, divs) => {
              const widgetIdMatch = div.match(/elfsight-app-([\w-]+)/);
              if (widgetIdMatch) {
                const widgetId = widgetIdMatch[1].replace(/-/g, '');

                return `${
                  divs.length !== 1 ? `<!-- ${widgetIdMatch[0]} -->\n` : ''
                }<iframe src=\"https://${widgetId}.elf.site" style=\"border: none; width: 100%" onload=\"iFrameResize(this)\"><\/iframe>\n`;
              }
            })
            .join('\n');

          iframeCodeTextArea.value = iframeResizerScript + iframeBlocks;
          copyButton.style.display = 'block';
        } else {
          iframeCodeTextArea.value = 'No valid widgets found';
          copyButton.style.display = 'none';
        }
      }
    </script>
  </body>
</html>
